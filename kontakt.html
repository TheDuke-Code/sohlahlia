<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt - Sohlahlia</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html">
            <img src="images/logga.png" alt="Sohlahlia loggan - till startsidan">
        </a>
        <!-- Knappen som öppnar och stänger hamburgemenyn på mobil -->
         <button class="menyknapp">☰ Meny</button>

        <!-- Navigationsmenyn -->
        <nav>
            <ul>
                <li><a href="index.html">Hem</a></li>
                <li><a href="dahlior.html">Våra Dahlior</a></li>
                <li><a href="odlingsguide.html">Odlingsguide</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Kontakta oss</h1>
        <p>Har du frågor om dahlior eller hur du odlar dom bäst? Skicka ett meddelande så svarar vi så snart vi kan!</p>

        <!-- Kontaktformuläret -->
        <form id="kontaktformular" novalidate>
            <label for="namn">Namn</label>
            <input type="text" id="namn" name="namn">
            <p class="felmeddelande" id="namnfel"></p>

            <label for="epost">E-post</label>
            <input type="email" id="epost" name="epost">
            <p class="felmeddelande" id="epostfel"></p>

            <label for="meddelande">Meddelande</label>
            <textarea id="meddelande" name="meddelande" rows="6"></textarea>
            <p class="felmeddelande" id="meddelandefel"></p>

            <button type="submit">Skicka</button>
            <p id="tack"></p>
        </form>
    </main>
    <footer>
        <address>
            <!-- Sidfot med kontaktuppgifter -->
            <p>Sohlahlia</p>
            <p>Dahliavägen 1, 123 45 Dahlstad</p>
            <p>Telefon 0522-123 45</p>
            <p>E-post: <a href="mailto:info@sohlahlia.se">info@sohlahlia.se</a></p>
        </address>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
